name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke-test the CLI against the bundled sample organization.
      - run: npm run ctx -- validate
      - run: npm run ctx -- build "Add a new payment provider to the payment service" --budget 1500 >> "$GITHUB_STEP_SUMMARY"
