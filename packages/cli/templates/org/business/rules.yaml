defaults:
  layer: business
  owner: product

units:
  - id: biz.goal.example
    kind: goal
    level: info
    title: Example goal (replace me)
    body: A measurable outcome the business is pursuing, and by when.
    tags: [goal]

  - id: biz.rule.example
    kind: business-rule
